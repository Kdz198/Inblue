<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Streaming TTS</title>
    <style>
        body { 
            font-family: 'Inter', Arial, sans-serif; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        h2 { color: #ffffff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #bbbbbb; }
        input, textarea, select { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            background-color: #1e1e1e; 
            border: 1px solid #333; 
            color: #ffffff; 
            border-radius: 6px;
        }
        input:focus, textarea:focus { outline: none; border-color: #007bff; }
        button { 
            padding: 12px 20px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        #log { 
            margin-top: 20px; 
            padding: 15px; 
            background: #1e1e1e; 
            border: 1px solid #333; 
            white-space: pre-wrap; 
            font-family: 'Courier New', Courier, monospace; 
            height: 200px; 
            overflow-y: auto; 
            border-radius: 6px;
            color: #a5d6a7;
        }
        #audioPlayer { margin-top: 20px; width: 100%; outline: none; }
        /* Customizing audio player for Webkit (Chrome/Safari) */
        audio::-webkit-media-controls-panel {
            background-color: #1e1e1e;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display,
        audio::-webkit-media-controls-timeline,
        audio::-webkit-media-controls-play-button,
        audio::-webkit-media-controls-mute-button {
            filter: invert(100%);
        }
    </style>
</head>
<body>

    <h2>Test Python TTS Streaming API</h2>
    
    <div class="form-group">
        <label for="voiceId">Voice ID (Tên giọng):</label>
        <input type="text" id="voiceId" value="Trúc Ly">
    </div>

    <div class="form-group">
        <label for="text">Văn bản cần đọc:</label>
        <textarea id="text" rows="4">Xin chào, đây là hệ thống thử nghiệm luồng âm thanh trực tiếp từ Python API qua Spring Boot.</textarea>
    </div>

    <div class="form-group">
        <label for="speed">Tốc độ đọc (Playback Speed): <span id="speedVal">1.0</span>x</label>
        <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1.0">
    </div>

    <div class="form-group">
        <label>Chiến thuật Buffering (Do máy sinh audio quá chậm):</label>
        <div>
            <input type="radio" id="modeFull" name="bufferMode" value="full" checked>
            <label for="modeFull" style="display:inline; font-weight:normal;">Đợi tải XONG HẾT rồi mới phát 1 lần (Mượt 100%)</label>
        </div>
        <div>
            <input type="radio" id="modeChunk" name="bufferMode" value="chunk">
            <label for="modeChunk" style="display:inline; font-weight:normal;">Phát ngay sau 2 giây (Chắc chắn sẽ bị ngắt quãng giữa chừng để chờ mạng)</label>
        </div>
    </div>

    <button id="btnPlay">Gửi Request & Phát Audio</button>

    <audio id="audioPlayer" controls></audio>

    <div id="log">Chờ thực hiện...</div>

    <script>
        const btnPlay = document.getElementById('btnPlay');
        const logEl = document.getElementById('log');
        const speedInput = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');

        speedInput.addEventListener('input', () => {
            speedVal.textContent = parseFloat(speedInput.value).toFixed(1);
        });

        function log(msg) {
            console.log(msg);
            logEl.textContent += msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        let audioCtx = null;
        let nextStartTime = 0;
        let isPlaying = false;
        let bufferedChunks = [];
        let totalBufferedDuration = 0;
        let isWaitingForFull = false;

        function flushBuffer() {
            if (bufferedChunks.length === 0) return;
            
            if (isPlaying && nextStartTime < audioCtx.currentTime) {
                log("⚠️ Hụt data (Underrun)! Tốc độ sinh AI quá chậm, tạm dừng để Buffering...");
                isPlaying = false;
                return; 
            }

            if (!isPlaying) {
                nextStartTime = audioCtx.currentTime + 0.1;
                isPlaying = true;
            }

            // Gộp tất cả các chunk nhỏ lại thành 1 chunk bự duy nhất để tránh tạo quá nhiều AudioNode
            let totalLen = bufferedChunks.reduce((acc, val) => acc + val.length, 0);
            let mergedPcm = new Uint8Array(totalLen);
            let offset = 0;
            for (let pcm of bufferedChunks) {
                mergedPcm.set(pcm, offset);
                offset += pcm.length;
            }

            const int16Array = new Int16Array(mergedPcm.buffer, mergedPcm.byteOffset, mergedPcm.byteLength / 2);
            const audioBuffer = audioCtx.createBuffer(1, int16Array.length, 48000);
            const channelData = audioBuffer.getChannelData(0);
            
            for (let i = 0; i < int16Array.length; i++) {
                channelData[i] = int16Array[i] / 32768.0;
            }
            
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            
            const currentSpeed = parseFloat(speedInput.value);
            source.playbackRate.value = currentSpeed;
            
            source.connect(audioCtx.destination);
            source.start(nextStartTime);
            
            nextStartTime += (audioBuffer.duration / currentSpeed);
            
            bufferedChunks = [];
            totalBufferedDuration = 0;
        }

        btnPlay.addEventListener('click', async () => {
            const text = document.getElementById('text').value;
            const voiceId = document.getElementById('voiceId').value;

            if (!text) {
                alert("Vui lòng nhập văn bản!");
                return;
            }

            btnPlay.disabled = true;
            logEl.textContent = '';
            
            isPlaying = false;
            bufferedChunks = [];
            totalBufferedDuration = 0;
            isWaitingForFull = document.getElementById('modeFull').checked;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            }
            // Mở khoá Audio Context (nếu bị block bởi trình duyệt)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            nextStartTime = audioCtx.currentTime;

            log("Đang kết nối tới API: /api/v1/interview/tts/python/stream ...");

            try {
                const response = await fetch('/api/v1/interview/tts/python/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, voiceId: voiceId })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                log("Kết nối thành công! Đang nhận & Phát Stream data...");

                const reader = response.body.getReader();
                let receivedLength = 0;
                let isFirstChunk = true;
                let leftover = new Uint8Array(0);
                
                let lastChunkTime = performance.now();

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) {
                        log("Hoàn tất nhận Stream!");
                        break;
                    }
                    
                    const now = performance.now();
                    const elapsed = (now - lastChunkTime).toFixed(2);
                    lastChunkTime = now;

                    receivedLength += value.length;
                    log(`Đã nhận & Đang phát chunk: ${value.length} bytes (Chờ: ${elapsed}ms)`);

                    // Gộp chunk mới với data thừa từ lần trước
                    let data = new Uint8Array(leftover.length + value.length);
                    data.set(leftover);
                    data.set(value, leftover.length);

                    // Bỏ 44 bytes header của file WAV ở chunk đầu tiên
                    if (isFirstChunk) {
                        if (data.length < 44) {
                            leftover = data;
                            continue;
                        }
                        data = data.slice(44);
                        isFirstChunk = false;
                    }

                    // Đảm bảo số lượng bytes phải là số chẵn (16-bit = 2 bytes)
                    let playLength = data.length - (data.length % 2);
                    leftover = data.slice(playLength);
                    let pcmData = data.slice(0, playLength);

                    if (pcmData.length > 0) {
                        let duration = pcmData.length / 2 / 48000;
                        bufferedChunks.push(pcmData);
                        totalBufferedDuration += duration;
                        
                        if (isWaitingForFull) {
                            log(`⏳ Đang tải ngầm... (Đã nạp ${totalBufferedDuration.toFixed(2)}s)`);
                        } else {
                            if (!isPlaying) {
                                log(`⏳ Đang Buffering... (${totalBufferedDuration.toFixed(2)}s / 2.0s)`);
                                if (totalBufferedDuration >= 2.0) {
                                    log("▶️ Đã đủ 2s Buffer! Bắt đầu phát...");
                                    flushBuffer();
                                }
                            } else {
                                flushBuffer();
                            }
                        }
                    }
                }
                
                if (bufferedChunks.length > 0) {
                    log("▶️ Stream kết thúc! Đang phát toàn bộ phần còn lại...");
                    isPlaying = false;
                    flushBuffer();
                }

            } catch (error) {
                log("Lỗi: " + error.message);
            } finally {
                btnPlay.disabled = false;
            }
        });
    </script>
</body>
</html>
